let currentTab = '유러피안 고메푸드';

function switchTab(tabName) {
    currentTab = tabName;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    renderContent();
    filterProducts();
}

function toggleCategory(el) {
    const wrap = el.nextElementSibling;
    if (wrap.style.maxHeight && wrap.style.maxHeight !== '0px') {
        wrap.style.maxHeight = '0px';
        el.querySelector('.toggle').textContent = '▶ 펼치기';
    } else {
        wrap.style.maxHeight = wrap.scrollHeight + 'px';
        el.querySelector('.toggle').textContent = '▼ 접기';
    }
}

function renderContent() {
    const items = DATA[currentTab];
    if (!items) return;
    
    // 카테고리별 그룹핑
    const groups = {};
    const groupOrder = [];
    items.forEach(item => {
        if (!groups[item.cat]) {
            groups[item.cat] = [];
            groupOrder.push(item.cat);
        }
        groups[item.cat].push(item);
    });
    
    let html = '<div class="legend">d : days &nbsp;|&nbsp; w : weeks &nbsp;|&nbsp; m : months &nbsp;|&nbsp; y : years</div>';
    
    groupOrder.forEach(cat => {
        const products = groups[cat];
        html += `<div class="category-section">`;
        html += `<div class="category-header" onclick="toggleCategory(this)">${escHtml(cat)} <span style="font-weight:300;font-size:14px;opacity:0.8">(${products.length})</span> <span class="toggle">▼ 접기</span></div>`;
        html += `<div class="category-table-wrap" style="max-height:none">`;
        html += `<table class="product-table">`;
        html += `<thead><tr>
            <th class="img-cell">제품</th>
            <th class="code-cell">구코드(품번)</th>
            <th class="name-cell">제품명</th>
            <th class="brand-cell">브랜드/ 원산지</th>
            <th class="unit-cell">단위</th>
            <th class="qty-cell">입수</th>
            <th class="sl-cell">S/L</th>
            <th class="desc-cell">제품 설명</th>
            <th class="note-cell">비고</th>
        </tr></thead><tbody>`;
        
        products.forEach(p => {
            const imgHtml = p.img 
                ? `<img src="images/${encodeURIComponent(p.img)}" alt="${escHtml(p.name_kr)}" loading="lazy">`
                : `<div class="img-placeholder">No Image</div>`;
            
            html += `<tr data-search="${escHtml((p.name_kr + ' ' + p.name_en + ' ' + p.code + ' ' + p.brand + ' ' + p.origin + ' ' + p.desc).toLowerCase())}">
                <td class="img-cell">${imgHtml}</td>
                <td class="code-cell">${escHtml(p.code)}</td>
                <td class="name-cell">
                    <div class="name-kr">${escHtml(p.name_kr)}</div>
                    <div class="name-en">${escHtml(p.name_en)}</div>
                </td>
                <td class="brand-cell">
                    <div class="brand-name">${escHtml(p.brand)}</div>
                    <div class="brand-divider"></div>
                    <div class="brand-origin">${escHtml(p.origin)}</div>
                    <div class="brand-origin-en">${escHtml(p.origin_en)}</div>
                </td>
                <td class="unit-cell">${escHtml(p.unit)}</td>
                <td class="qty-cell">${escHtml(p.qty)}</td>
                <td class="sl-cell">${escHtml(p.sl)}</td>
                <td class="desc-cell">${escHtml(p.desc)}</td>
                <td class="note-cell">${escHtml(p.note)}</td>
            </tr>`;
        });
        
        html += `</tbody></table></div></div>`;
    });
    
    document.getElementById('content').innerHTML = html;
}

function filterProducts() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const rows = document.querySelectorAll('.product-table tbody tr');
    let visible = 0;
    
    rows.forEach(row => {
        const text = row.getAttribute('data-search') || '';
        if (!query || text.includes(query)) {
            row.classList.remove('hidden');
            visible++;
        } else {
            row.classList.add('hidden');
        }
    });
    
    // 빈 카테고리 숨기기
    document.querySelectorAll('.category-section').forEach(section => {
        const visibleRows = section.querySelectorAll('tbody tr:not(.hidden)');
        section.style.display = visibleRows.length > 0 ? '' : 'none';
    });
    
    const total = rows.length;
    const countEl = document.getElementById('searchCount');
    const noResults = document.getElementById('noResults');
    
    if (query) {
        countEl.textContent = `${visible} / ${total}`;
        noResults.style.display = visible === 0 ? 'block' : 'none';
    } else {
        countEl.textContent = '';
        noResults.style.display = 'none';
    }
}

function escHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// 초기 렌더링
renderContent();
</script>
